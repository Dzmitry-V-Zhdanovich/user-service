spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:user_service_db}
    username: ${DB_USERNAME:javauser}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8081

logging:
  level:
    com.innowise.userservice: INFO