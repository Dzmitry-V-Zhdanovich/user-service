databaseChangeLog:
  - changeSet:
      id: 1
      author: Dmitry
      labels: create-table
      comment: "Create users table"
      changes:
        - createTable:
            tableName: users
            remarks: "Table with registered users"
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "Primary key"
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: "User first name"
              - column:
                  name: surname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: "User last name"
              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: "Date of birth"
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
                  remarks: "Email address (unique)"
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                  remarks: "Is user active"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Creation timestamp"
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Last update timestamp"

      rollback:
        - dropTable:
            tableName: users