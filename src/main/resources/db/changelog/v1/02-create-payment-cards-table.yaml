databaseChangeLog:
  - changeSet:
      id: 2
      author: Dmitry
      labels: create-table, foreign-key
      comment: "Create payment_cards table with foreign key"
      changes:
        - createTable:
            tableName: payment_cards
            remarks: "Payment cards of users"
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "Primary key"
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: "Foreign key to users table"
              - column:
                  name: number
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
                  remarks: "Card number (unique)"
              - column:
                  name: holder
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                  remarks: "Cardholder name"
              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: "Card expiration date"
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                  remarks: "Is card active"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Creation timestamp"
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Last update timestamp"

        - addForeignKeyConstraint:
            baseTableName: payment_cards
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_payment_cards_user
            onDelete: CASCADE
            onUpdate: RESTRICT

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: payment_cards
            constraintName: fk_payment_cards_user
        - dropTable:
            tableName: payment_cards