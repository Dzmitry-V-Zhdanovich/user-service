name: CI Pipeline for User Service
on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_IMAGE_NAME: user-service
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Run Tests and Generate Coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify sonar:sonar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase registry path
        run: |
          echo "DOCKER_REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_LOWER }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_LOWER }}:${{ github.sha }} ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_LOWER }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_LOWER }}:${{ github.sha }}
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_LOWER }}:latest

      - name: Save image metadata
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}" >> $GITHUB_ENV
      
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build-and-test, docker]
    if: always() && failure()
    steps:
      - name: Send notification
        run: |
          echo "CI Pipeline failed for commit ${{ github.sha }}"
          echo "Check the logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"